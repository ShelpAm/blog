services:
  # Serves the built static site via nginx.
  blog:
    image: nginx:alpine
    ports:
      - "4000:80"
    volumes:
      - site:/usr/share/nginx/html
    restart: unless-stopped

  # Listens for GitHub webhook POSTs and redeploys the site via tools/deploy.sh.
  # Mount the repo root so that `git pull` inside the container works.
  # If you use SSH authentication, also mount your key:
  #   - ~/.ssh:/root/.ssh:ro
  webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    ports:
      - "9001:9001"
    volumes:
      - .:/site          # repo bind-mount — enables git pull inside container
      - site:/site/_site # shared named volume — nginx reads built files from here
    restart: unless-stopped

volumes:
  site:
